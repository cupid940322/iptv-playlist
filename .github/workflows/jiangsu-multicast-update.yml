name: Auto update Jiangsu multicast playlist

on:
  schedule:
    - cron: '37 2 * * *'  # UTC 2:37 = 北京时间每天早上 10:37（非整点，减少调度延迟）
  workflow_dispatch:     # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scrape Jiangsu multicast channels
        run: |
          python3 scripts/jiangsu_multicast_scraper.py
          head -4 jiangsu-multicast.m3u8

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jiangsu-multicast.m3u8 jiangsu-multicast.m3u
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新江苏组播列表: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "已提交更新"
