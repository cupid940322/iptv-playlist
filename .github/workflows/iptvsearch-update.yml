name: Auto update iptv-search China local playlist

on:
  schedule:
    - cron: '7 2 * * *'  # UTC 2:07 = 北京时间每天早上 10:07（非整点，减少调度延迟）
  workflow_dispatch:     # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scrape iptv-search China local channels
        run: |
          python3 scripts/iptvsearch_scraper.py
          head -3 china-local.m3u8

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add china-local.m3u8 china-local.m3u
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新 iptv-search 中国地方台列表: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "已提交更新"
