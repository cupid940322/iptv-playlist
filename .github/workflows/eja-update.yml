name: Auto update eja.tv China playlist

on:
  schedule:
    - cron: '30 1 * * *'  # UTC 1:30 = 北京时间每天早上 9:30
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scrape eja.tv China channels
        run: |
          python3 scripts/eja_scraper.py
          head -3 china.m3u8

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add china.m3u8 china.m3u
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新 eja.tv 中国频道列表: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "已提交更新"
